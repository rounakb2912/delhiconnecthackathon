<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delhi Transit Intelligence & Dynamic Journey Planner</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚌</text></svg>" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet GIS CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- React 18, ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-base: #070b14;
      --bg-card: rgba(15, 23, 42, 0.82);
      --bg-card-hover: rgba(30, 41, 59, 0.9);
      --bg-elevated: #131d31;
      --border-subtle: rgba(255, 107, 53, 0.22);
      --border-accent: rgba(255, 107, 53, 0.65);
      --border-glass: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary-orange: #ff6b35;
      --primary-glow: rgba(255, 107, 53, 0.35);
      --accent-cyan: #00f0ff;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #ef4444;
      --accent-indigo: #6366f1;
      --card-shadow: 0 10px 32px -4px rgba(0, 0, 0, 0.55);
    }

    [data-theme="light"] {
      --bg-base: #f4f6fa;
      --bg-card: rgba(255, 255, 255, 0.94);
      --bg-card-hover: rgba(248, 250, 252, 1);
      --bg-elevated: #e2e8f0;
      --border-subtle: rgba(255, 107, 53, 0.28);
      --border-accent: rgba(255, 107, 53, 0.85);
      --border-glass: rgba(0, 0, 0, 0.08);
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
      --primary-orange: #ea580c;
      --primary-glow: rgba(234, 88, 12, 0.25);
      --accent-cyan: #0284c7;
      --accent-emerald: #059669;
      --accent-amber: #d97706;
      --accent-rose: #dc2626;
      --accent-indigo: #4f46e5;
      --card-shadow: 0 10px 30px -4px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .top-tricolor-bar {
      height: 4px;
      background: linear-gradient(90deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
      box-shadow: 0 0 16px rgba(255, 153, 51, 0.8);
      width: 100%;
    }

    .glass-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--card-shadow);
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .glass-panel-glow {
      border-color: var(--border-subtle);
      box-shadow: var(--card-shadow), 0 0 20px rgba(255, 107, 53, 0.12);
    }

    .glass-panel-glow:hover {
      border-color: var(--border-accent);
    }

    /* Leaflet Overrides */
    .leaflet-container {
      font-family: inherit;
      background: #0b0f19 !important;
    }

    .leaflet-popup-content-wrapper {
      background: var(--bg-card) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 12px !important;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6) !important;
      backdrop-filter: blur(16px) !important;
      padding: 4px !important;
    }
    .leaflet-popup-tip {
      background: var(--bg-card) !important;
      border: 1px solid var(--border-subtle) !important;
    }

    .leaflet-control-layers {
      background: var(--bg-card) !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 12px !important;
      color: var(--text-main) !important;
      backdrop-filter: blur(16px) !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;
      padding: 10px 14px !important;
    }
    .leaflet-control-layers label {
      color: var(--text-main) !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      margin-bottom: 6px !important;
      cursor: pointer !important;
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
    }
    .leaflet-control-layers label:hover {
      color: var(--primary-orange) !important;
    }

    .leaflet-control-zoom {
      border: 1px solid var(--border-subtle) !important;
      border-radius: 10px !important;
      overflow: hidden !important;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4) !important;
    }
    .leaflet-control-zoom a {
      background: var(--bg-card) !important;
      color: var(--primary-orange) !important;
      border-color: var(--border-glass) !important;
    }
    .leaflet-control-zoom a:hover {
      background: rgba(255, 107, 53, 0.25) !important;
      color: #ffffff !important;
    }

    @keyframes pulseGreen {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    @keyframes pulseOrange {
      0% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(255, 107, 53, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0); }
    }

    @keyframes pulseCyan {
      0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.8); }
      70% { box-shadow: 0 0 0 14px rgba(0, 240, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
    }

    @keyframes waveBar {
      0%, 100% { height: 6px; }
      50% { height: 22px; }
    }

    .pulse-dot-green {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: #10b981;
      display: inline-block;
      animation: pulseGreen 2s infinite;
    }

    .pulse-dot-orange {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: #ff6b35;
      display: inline-block;
      animation: pulseOrange 2s infinite;
    }

    .pulse-dot-cyan {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #00f0ff;
      display: inline-block;
      animation: pulseCyan 1.6s infinite;
    }

    .audio-bar {
      width: 3px;
      background: #ff6b35;
      border-radius: 3px;
      animation: waveBar 0.8s ease-in-out infinite;
    }
    .audio-bar:nth-child(2) { animation-delay: 0.15s; }
    .audio-bar:nth-child(3) { animation-delay: 0.3s; }
    .audio-bar:nth-child(4) { animation-delay: 0.45s; }
    .audio-bar:nth-child(5) { animation-delay: 0.2s; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary-orange); }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .metro-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(99, 102, 241, 0.45);
      color: #818cf8;
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast-item {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.95);
      color: #f8fafc;
      border: 1px solid var(--border-accent);
      border-radius: 10px;
      padding: 12px 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      animation: slideInRight 0.3s ease;
      min-width: 280px;
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .hud-card {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--border-accent);
      border-radius: 12px;
      padding: 10px 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(14px);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const CONGESTION_COLORS = {
      free_flow: '#10b981',
      moderate: '#f59e0b',
      heavy: '#f97316',
      gridlock: '#ef4444',
      severe: '#ef4444',
    };

    // Helper: Haversine distance in meters
    function calcHaversine(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // Speech synthesis announcement
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-IN';
        u.rate = 1.0;
        u.pitch = 1.0;
        window.speechSynthesis.speak(u);
      }
    }

    // Audio chime for dispatcher actions
    function playChime(type = 'success') {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'success') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.18);
        } else {
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(330, ctx.currentTime + 0.18);
        }
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.28);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    // --- Autocomplete Stop Input Component ---
    function StopAutocomplete({ label, value, onChange, stops, placeholder, icon }) {
      const [isOpen, setIsOpen] = useState(false);
      const [search, setSearch] = useState('');
      const wrapperRef = useRef(null);

      useEffect(() => {
        setSearch(value || '');
      }, [value]);

      useEffect(() => {
        function handleClickOutside(event) {
          if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
            setIsOpen(false);
          }
        }
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const filteredStops = useMemo(() => {
        const q = search.trim().toLowerCase();
        if (!q) return stops.slice(0, 12);
        return stops.filter(s =>
          s.name.toLowerCase().includes(q) ||
          s.stop_id.toLowerCase().includes(q) ||
          (s.metro_lines || []).some(m => m.toLowerCase().includes(q))
        ).slice(0, 12);
      }, [search, stops]);

      return (
        <div ref={wrapperRef} style={{ position: 'relative', width: '100%' }}>
          <label style={{ fontSize: '0.74rem', color: 'var(--text-muted)', display: 'block', marginBottom: '4px', fontWeight: 600 }}>
            {label}
          </label>
          <div style={{ position: 'relative' }}>
            <span style={{ position: 'absolute', left: '10px', top: '50%', transform: 'translateY(-50%)', fontSize: '1rem', pointerEvents: 'none' }}>
              {icon}
            </span>
            <input
              type="text"
              value={search}
              placeholder={placeholder || 'Type stop or metro...'}
              onFocus={() => setIsOpen(true)}
              onChange={e => {
                setSearch(e.target.value);
                setIsOpen(true);
              }}
              style={{
                width: '100%',
                background: 'var(--bg-elevated)',
                color: 'var(--text-main)',
                border: '1px solid var(--border-subtle)',
                borderRadius: '8px',
                padding: '9px 12px 9px 34px',
                fontSize: '0.84rem',
                fontWeight: 600,
                outline: 'none',
              }}
            />
            {search && (
              <button
                type="button"
                onClick={() => { setSearch(''); onChange(''); setIsOpen(true); }}
                style={{
                  position: 'absolute', right: '10px', top: '50%', transform: 'translateY(-50%)',
                  background: 'transparent', border: 'none', color: 'var(--text-dim)', cursor: 'pointer', fontSize: '0.8rem'
                }}
              >
                ✕
              </button>
            )}
          </div>

          {isOpen && (
            <div style={{
              position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 1000,
              background: 'var(--bg-card)', border: '1px solid var(--border-accent)',
              borderRadius: '10px', marginTop: '4px', maxHeight: '240px', overflowY: 'auto',
              boxShadow: '0 12px 32px rgba(0,0,0,0.65)', backdropFilter: 'blur(16px)'
            }}>
              {filteredStops.length > 0 ? (
                filteredStops.map(s => (
                  <div
                    key={s.stop_id}
                    onClick={() => {
                      onChange(s.name);
                      setSearch(s.name);
                      setIsOpen(false);
                    }}
                    style={{
                      padding: '8px 12px', borderBottom: '1px solid var(--border-glass)',
                      cursor: 'pointer', transition: 'background 0.15s ease',
                    }}
                    onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-card-hover)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                  >
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <strong style={{ fontSize: '0.84rem', color: 'var(--text-main)' }}>{s.name}</strong>
                      <span style={{ fontSize: '0.7rem', color: 'var(--text-dim)', fontFamily: "'JetBrains Mono', monospace" }}>{s.stop_id}</span>
                    </div>
                    {s.metro_lines && s.metro_lines.length > 0 && (
                      <div style={{ display: 'flex', gap: '4px', flexWrap: 'wrap', marginTop: '3px' }}>
                        {s.metro_lines.map((m, mIdx) => (
                          <span key={mIdx} className="metro-badge">🚇 {m}</span>
                        ))}
                      </div>
                    )}
                  </div>
                ))
              ) : (
                <div style={{ padding: '10px', fontSize: '0.78rem', color: 'var(--text-dim)', textAlign: 'center' }}>
                  No stops found matching "{search}"
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // --- Main App Component ---
    function App() {
      const [theme, setTheme] = useState('dark');
      const [status, setStatus] = useState({});
      const [fleet, setFleet] = useState([]);
      const [segments, setSegments] = useState([]);
      const [stops, setStops] = useState([]);
      const [predictions, setPredictions] = useState([]);
      const [activeTab, setActiveTab] = useState('map');

      // Journey Planning State
      const [selectedSrc, setSelectedSrc] = useState('Connaught Place');
      const [selectedDst, setSelectedDst] = useState('AIIMS');
      const [route, setRoute] = useState(null);
      const [clickPoints, setClickPoints] = useState({ start: null, end: null });

      // Map Viewport and Layer Controls
      const [corridorFocus, setCorridorFocus] = useState('all');
      const [layerVisibility, setLayerVisibility] = useState({
        segments: true,
        fleet: true,
        stops: true,
        walkshed: false,
      });

      // Alerts & Branching
      const [alerts, setAlerts] = useState({ bottlenecks: [], bunching: [], timestamp: '' });
      const [branchOrigin, setBranchOrigin] = useState('Connaught Place');
      const [branchDest, setBranchDest] = useState('AIIMS');
      const [branchData, setBranchData] = useState(null);
      const [branchLoading, setBranchLoading] = useState(false);

      // New Interactive States
      const [selectedStopData, setSelectedStopData] = useState(null);
      const [trackingBus, setTrackingBus] = useState(null); // Bus ID currently locked onto
      const [isSimulating, setIsSimulating] = useState(false);
      const [simProgress, setSimProgress] = useState(0); // 0 to 100
      const [simSpeedMultiplier, setSimSpeedMultiplier] = useState(1);
      const [timeOffsetMinutes, setTimeOffsetMinutes] = useState(0); // 0, 15, 30, 45, 60 min forecast
      const [speechEnabled, setSpeechEnabled] = useState(true);
      const [isListening, setIsListening] = useState(false);
      const [voiceStatus, setVoiceStatus] = useState('');
      const [showItinerary, setShowItinerary] = useState(true);
      const [showTransitPass, setShowTransitPass] = useState(false);
      const [refreshing, setRefreshing] = useState(false);
      const [toasts, setToasts] = useState([]);

      const addToast = (msg, icon = 'ℹ️') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, msg, icon }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4000);
      };

      const toggleTheme = () => {
        const newTheme = theme === 'dark' ? 'light' : 'dark';
        setTheme(newTheme);
        document.documentElement.setAttribute('data-theme', newTheme);
        addToast(`Switched to ${newTheme.toUpperCase()} mode`, newTheme === 'dark' ? '🌙' : '☀️');
      };

      // Base Data Fetch
      const fetchBaseData = async () => {
        try {
          const [segRes, stopRes, predRes] = await Promise.all([
            fetch('/api/segments'),
            fetch('/api/stops'),
            fetch('/api/predictions'),
          ]);
          if (segRes.ok) setSegments(await segRes.json());
          if (stopRes.ok) setStops(await stopRes.json());
          if (predRes.ok) setPredictions(await predRes.json());
        } catch (err) {
          console.error('Base data error:', err);
        }
      };

      // Telemetry Polling
      const fetchLiveTelemetry = async () => {
        try {
          const [statusRes, fleetRes, alertsRes] = await Promise.all([
            fetch('/api/status'),
            fetch('/api/fleet?limit=600'),
            fetch('/api/alerts'),
          ]);
          if (statusRes.ok) setStatus(await statusRes.json());
          if (fleetRes.ok) setFleet(await fleetRes.json());
          if (alertsRes.ok) setAlerts(await alertsRes.json());
        } catch (err) {
          console.error('Telemetry poll error:', err);
        }
      };

      // Corridor Branches Fetch
      const fetchBranches = async (o = branchOrigin, d = branchDest) => {
        setBranchLoading(true);
        try {
          const res = await fetch(`/api/corridor-branches?origin=${encodeURIComponent(o)}&destination=${encodeURIComponent(d)}`);
          if (res.ok) {
            setBranchData(await res.json());
          }
        } catch (err) {
          console.error('Failed to load corridor branches:', err);
        } finally {
          setBranchLoading(false);
        }
      };

      // Stop Arrivals Fetch
      const fetchStopArrivals = async (stopId) => {
        try {
          const res = await fetch(`/api/stop-arrivals/${stopId}`);
          if (res.ok) {
            const data = await res.json();
            setSelectedStopData(data);
            addToast(`Loaded live arrivals for ${data.stop_name}`, '🚏');
          }
        } catch (err) {
          console.error('Stop arrivals error:', err);
        }
      };

      // Plan Route
      const handlePlanRoute = async (sLat, sLon, eLat, eLon, sName = selectedSrc, dName = selectedDst) => {
        setClickPoints({ start: [sLat, sLon], end: [eLat, eLon] });
        setIsSimulating(false);
        setSimProgress(0);
        try {
          const res = await fetch('/api/route', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ start_lat: sLat, start_lon: sLon, end_lat: eLat, end_lon: eLon }),
          });
          if (res.ok) {
            const data = await res.json();
            setRoute(data);
            addToast(`Optimal route found: ~${data.eta_minutes} mins via ${data.segments_count} corridors`, '⚡');
            if (speechEnabled) {
              speakText(`Route from ${sName} to ${dName} calculated. Travel time is approximately ${Math.round(data.eta_minutes)} minutes. Delhi Transport fare is ${data.fare_inr} rupees.`);
            }
          }
        } catch (err) {
          console.error('Routing failed:', err);
          addToast('Routing computation failed. Please re-check points.', '⚠️');
        }
      };

      // Manual Telemetry Refresh
      const handleManualSync = async () => {
        setRefreshing(true);
        try {
          await fetch('/api/refresh', { method: 'POST' });
          await fetchLiveTelemetry();
          await fetchBranches(branchOrigin, branchDest);
          addToast('Live Delhi transit telemetry synchronized!', '🔄');
          playChime('success');
        } catch (err) {
          addToast('Sync timed out. Using cached fleet.', '⚠️');
        } finally {
          setRefreshing(false);
        }
      };

      // Voice Search (Bolo Delhi)
      const handleVoiceSearch = () => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert('Web Speech API is not supported in this browser. Please use Chrome or Edge.');
          return;
        }
        const rec = new SpeechRec();
        rec.lang = 'en-IN';
        rec.interimResults = false;
        rec.maxAlternatives = 1;

        setIsListening(true);
        setVoiceStatus('🎙️ Listening... Say e.g. "Rohini to CP" or "Kashmere Gate se AIIMS"');

        rec.onresult = (e) => {
          const transcript = e.results[0][0].transcript.toLowerCase();
          setIsListening(false);
          setVoiceStatus(`🗣️ Heard: "${transcript}"`);

          let src = '';
          let dst = '';
          if (transcript.includes(' to ')) {
            const parts = transcript.split(' to ');
            src = parts[0].replace('from', '').trim();
            dst = parts[1].trim();
          } else if (transcript.includes(' se ')) {
            const parts = transcript.split(' se ');
            src = parts[0].trim();
            dst = parts[1].trim();
          }

          if (src && dst && stops.length > 0) {
            const sObj = stops.find(s => s.name.toLowerCase().includes(src) || src.includes(s.name.toLowerCase()));
            const dObj = stops.find(s => s.name.toLowerCase().includes(dst) || dst.includes(s.name.toLowerCase()));
            if (sObj && dObj) {
              setSelectedSrc(sObj.name);
              setSelectedDst(dObj.name);
              handlePlanRoute(sObj.lat, sObj.lon, dObj.lat, dObj.lon, sObj.name, dObj.name);
              setVoiceStatus(`✅ Planned route: ${sObj.name} ➔ ${dObj.name}`);
            } else {
              setVoiceStatus(`⚠️ Could not match stops in "${transcript}". Please try again.`);
            }
          } else {
            setVoiceStatus(`⚠️ Please say "From [Stop A] to [Stop B]"`);
          }
        };

        rec.onerror = (e) => {
          setIsListening(false);
          setVoiceStatus(`⚠️ Voice error: ${e.error}`);
        };
        rec.onend = () => setIsListening(false);
        rec.start();
      };

      // Swap Origin and Destination
      const handleSwapLocations = () => {
        const temp = selectedSrc;
        setSelectedSrc(selectedDst);
        setSelectedDst(temp);
        const sObj = stops.find(s => s.name === selectedDst);
        const dObj = stops.find(s => s.name === temp);
        if (sObj && dObj) {
          handlePlanRoute(sObj.lat, sObj.lon, dObj.lat, dObj.lon, sObj.name, dObj.name);
        }
        addToast('Swapped Origin & Destination', '⇄');
      };

      // Dispatch Bunching Resolution
      const handleDispatchResolve = async (routeId) => {
        try {
          const res = await fetch(`/api/resolve-bunching?route_id=${encodeURIComponent(routeId)}&hold_minutes=4`, { method: 'POST' });
          if (res.ok) {
            const data = await res.json();
            playChime('success');
            addToast(`Dispatch issued for Route ${routeId}: ${data.action}`, '🚨');
          }
        } catch (e) {
          addToast(`Dispatched headway adjustment order for Route ${routeId}`, '🚨');
        }
      };

      // Setup window handlers and polling
      useEffect(() => {
        fetchBaseData();
        fetchLiveTelemetry();
        fetchBranches(branchOrigin, branchDest);

        const timer = setInterval(() => {
          fetchLiveTelemetry();
          fetchBranches(branchOrigin, branchDest);
        }, 16000);

        window.__setOrigin = (lat, lon, name) => {
          setSelectedSrc(name);
          setRoute(null);
          setClickPoints({ start: [lat, lon], end: null });
          addToast(`Origin set to ${name}`, '🟢');
        };
        window.__setDest = (lat, lon, name) => {
          setSelectedDst(name);
          setClickPoints(prev => {
            const startPt = prev.start || [28.6315, 77.2167];
            handlePlanRoute(startPt[0], startPt[1], lat, lon, selectedSrc, name);
            return { start: startPt, end: [lat, lon] };
          });
        };
        window.__viewStopArrivals = (stopId) => {
          fetchStopArrivals(stopId);
        };
        window.__trackBus = (busId) => {
          setTrackingBus(busId);
          setActiveTab('map');
          addToast(`Locking camera on Bus #${busId}`, '🛰️');
        };

        return () => clearInterval(timer);
      }, []);

      // Click to route on map
      const handleMapClick = (lat, lon) => {
        setClickPoints(prev => {
          if (!prev.start || (prev.start && prev.end)) {
            setRoute(null);
            setSelectedSrc(`GPS (${lat.toFixed(4)}, ${lon.toFixed(4)})`);
            addToast('Origin selected on map! Now click destination.', '🟢');
            return { start: [lat, lon], end: null };
          } else {
            setSelectedDst(`GPS (${lat.toFixed(4)}, ${lon.toFixed(4)})`);
            handlePlanRoute(prev.start[0], prev.start[1], lat, lon);
            return { start: prev.start, end: [lat, lon] };
          }
        });
      };

      // Compute Transit Health Index
      const transitHealthScore = useMemo(() => {
        if (!segments || segments.length === 0) return 85;
        const freeOrMod = segments.filter(s => s.congestion_level === 'free_flow' || s.congestion_level === 'moderate').length;
        return Math.round((freeOrMod / segments.length) * 100);
      }, [segments]);

      return (
        <div style={{ maxWidth: '1440px', margin: '0 auto', padding: '0 20px 40px 20px' }}>
          {/* Top Tricolor Accent Bar */}
          <div className="top-tricolor-bar" />

          {/* Header */}
          <header style={{ marginBottom: '20px' }}>
            <div className="glass-panel" style={{ padding: '20px 28px', marginTop: '12px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '16px' }}>
                <div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                    <span style={{ fontSize: '2rem' }}>🚌</span>
                    <div>
                      <h1 style={{
                        fontSize: '1.75rem',
                        fontWeight: 800,
                        background: 'linear-gradient(90deg, #FF9933 0%, #FF6B35 50%, #FFA07A 100%)',
                        WebkitBackgroundClip: 'text',
                        WebkitTextFillColor: 'transparent',
                        letterSpacing: '-0.02em',
                      }}>
                        Delhi Bus Traffic Model & Dynamic Journey Planner
                      </h1>
                      <p style={{ color: 'var(--text-muted)', fontSize: '0.88rem', marginTop: '2px', fontWeight: 500 }}>
                        High-Performance Real-Time Transit GIS • A* Congestion Routing • ML Speed Forecasts
                      </p>
                    </div>
                  </div>
                </div>

                {/* Header Controls */}
                <div style={{ display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap' }}>
                  <div style={{
                    display: 'flex', alignItems: 'center', gap: '8px', padding: '6px 14px', borderRadius: '20px',
                    background: status.is_live ? 'rgba(16, 185, 129, 0.15)' : 'rgba(245, 158, 11, 0.15)',
                    border: `1px solid ${status.is_live ? 'rgba(16, 185, 129, 0.45)' : 'rgba(245, 158, 11, 0.45)'}`,
                    fontSize: '0.8rem', fontWeight: 700,
                    color: status.is_live ? '#10b981' : '#f59e0b'
                  }}>
                    <span className={status.is_live ? "pulse-dot-green" : "pulse-dot-orange"} />
                    {status.is_live ? "DELHI OTD LIVE FEED" : "SYNTHETIC BASELINE"}
                  </div>

                  <button
                    onClick={handleManualSync}
                    disabled={refreshing}
                    title="Poll Delhi Open Transit Data API"
                    style={{
                      background: 'linear-gradient(135deg, #FF6B35 0%, #e85d04 100%)',
                      color: '#fff', border: 'none', padding: '8px 16px', borderRadius: '10px',
                      fontWeight: 700, fontSize: '0.82rem', cursor: refreshing ? 'not-allowed' : 'pointer',
                      boxShadow: '0 4px 14px rgba(255, 107, 53, 0.35)', display: 'flex', alignItems: 'center', gap: '6px',
                    }}
                  >
                    <span style={{ display: 'inline-block', transform: refreshing ? 'rotate(360deg)' : 'none', transition: 'transform 0.8s infinite linear' }}>🔄</span>
                    {refreshing ? 'Syncing...' : 'Sync OTD'}
                  </button>

                  <button
                    onClick={() => setSpeechEnabled(!speechEnabled)}
                    title="Toggle Text-to-Speech Announcements"
                    style={{
                      background: speechEnabled ? 'rgba(99, 102, 241, 0.2)' : 'var(--bg-elevated)',
                      color: speechEnabled ? '#818cf8' : 'var(--text-dim)',
                      border: `1px solid ${speechEnabled ? 'rgba(99, 102, 241, 0.45)' : 'var(--border-glass)'}`,
                      padding: '8px 12px', borderRadius: '10px', fontWeight: 700, fontSize: '0.82rem', cursor: 'pointer',
                    }}
                  >
                    {speechEnabled ? '🔊 Audio ON' : '🔇 Audio OFF'}
                  </button>

                  <button
                    onClick={toggleTheme}
                    title="Toggle Dark / Light Theme"
                    style={{
                      background: 'var(--bg-elevated)', color: 'var(--text-main)',
                      border: '1px solid var(--border-glass)', padding: '8px 12px',
                      borderRadius: '10px', fontWeight: 700, fontSize: '0.82rem', cursor: 'pointer',
                    }}
                  >
                    {theme === 'dark' ? '☀️ Light' : '🌙 Dark'}
                  </button>

                  {route && (
                    <button
                      onClick={() => setShowTransitPass(true)}
                      style={{
                        background: 'rgba(16, 185, 129, 0.2)', color: '#10b981',
                        border: '1px solid rgba(16, 185, 129, 0.45)', padding: '8px 14px',
                        borderRadius: '10px', fontWeight: 700, fontSize: '0.82rem', cursor: 'pointer',
                      }}
                    >
                      🎫 Pass
                    </button>
                  )}
                </div>
              </div>

              {/* Sub-bar Status */}
              <div style={{
                display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                marginTop: '14px', paddingTop: '12px', borderTop: '1px solid var(--border-glass)',
                fontSize: '0.82rem', color: 'var(--text-muted)', flexWrap: 'wrap', gap: '10px'
              }}>
                <div>⚡ Connected Fleet: <strong style={{ color: 'var(--text-main)' }}>{status.total_active_fleet?.toLocaleString() || '0'} Delhi Buses</strong> across {segments.length} Road Corridors</div>
                <div>⏱️ Last Telemetry Sync: <strong style={{ color: 'var(--accent-cyan)' }}>{status.last_sync_time || 'Just now'}</strong> (Auto-polled every 16s)</div>
              </div>
            </div>
          </header>

          {/* KPI Metrics Dashboard Cards */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '14px', marginBottom: '20px' }}>
            <div className="glass-panel" style={{ padding: '16px 20px' }}>
              <span style={{ fontSize: '0.72rem', fontWeight: 700, color: 'var(--text-dim)', letterSpacing: '0.05em' }}>TOTAL ACTIVE FLEET</span>
              <div style={{ fontSize: '1.8rem', fontWeight: 800, color: 'var(--text-main)', fontFamily: "'JetBrains Mono', monospace", marginTop: '4px' }}>
                {status.total_active_fleet?.toLocaleString() || '0'}
              </div>
              <span style={{ fontSize: '0.74rem', color: 'var(--text-dim)' }}>Live DTC & DIMTS units</span>
            </div>

            <div className="glass-panel" style={{ padding: '16px 20px' }}>
              <span style={{ fontSize: '0.72rem', fontWeight: 700, color: 'var(--text-dim)', letterSpacing: '0.05em' }}>VEHICLES IN MOTION</span>
              <div style={{ fontSize: '1.8rem', fontWeight: 800, color: 'var(--accent-emerald)', fontFamily: "'JetBrains Mono', monospace", marginTop: '4px' }}>
                {status.moving_buses?.toLocaleString() || '0'}
              </div>
              <span style={{ fontSize: '0.74rem', color: 'var(--text-dim)' }}>Speed ≥ 5 km/h</span>
            </div>

            <div className="glass-panel" style={{ padding: '16px 20px' }}>
              <span style={{ fontSize: '0.72rem', fontWeight: 700, color: 'var(--text-dim)', letterSpacing: '0.05em' }}>IDLE / DWELL / SIGNALS</span>
              <div style={{ fontSize: '1.8rem', fontWeight: 800, color: 'var(--accent-amber)', fontFamily: "'JetBrains Mono', monospace", marginTop: '4px' }}>
                {status.idle_buses?.toLocaleString() || '0'}
              </div>
              <span style={{ fontSize: '0.74rem', color: 'var(--text-dim)' }}>At stops & intersections</span>
            </div>

            <div className="glass-panel" style={{ padding: '16px 20px' }}>
              <span style={{ fontSize: '0.72rem', fontWeight: 700, color: 'var(--text-dim)', letterSpacing: '0.05em' }}>FLEET AVG VELOCITY</span>
              <div style={{ fontSize: '1.8rem', fontWeight: 800, color: 'var(--accent-cyan)', fontFamily: "'JetBrains Mono', monospace", marginTop: '4px' }}>
                {status.fleet_avg_speed_kmh || 0} km/h
              </div>
              <span style={{ fontSize: '0.74rem', color: 'var(--text-dim)' }}>Network displacement</span>
            </div>

            <div className="glass-panel" style={{ padding: '16px 20px' }}>
              <span style={{ fontSize: '0.72rem', fontWeight: 700, color: 'var(--text-dim)', letterSpacing: '0.05em' }}>TRANSIT HEALTH INDEX</span>
              <div style={{ fontSize: '1.8rem', fontWeight: 800, color: transitHealthScore >= 75 ? 'var(--accent-emerald)' : 'var(--accent-amber)', fontFamily: "'JetBrains Mono', monospace", marginTop: '4px' }}>
                {transitHealthScore}%
              </div>
              <span style={{ fontSize: '0.74rem', color: 'var(--text-dim)' }}>Free & moderate corridors</span>
            </div>
          </div>

          {/* Calculated Route Banner with DTC Fare, CO2 & Simulation Trigger */}
          {route && (
            <div className="glass-panel glass-panel-glow" style={{ marginBottom: '20px', padding: '16px 22px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '14px' }}>
                <div>
                  <span style={{ fontSize: '0.74rem', fontWeight: 800, color: 'var(--accent-cyan)', letterSpacing: '0.05em', textTransform: 'uppercase' }}>
                    ⚡ DYNAMIC A* OPTIMIZED ROUTE
                  </span>
                  <div style={{ fontSize: '0.94rem', color: 'var(--text-main)', fontWeight: 700, marginTop: '2px' }}>
                    Traversing {route.segments_count} Delhi Corridors ({selectedSrc} ➔ {selectedDst})
                  </div>
                </div>

                <div style={{ display: 'flex', gap: '18px', flexWrap: 'wrap', alignItems: 'center' }}>
                  <div><span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>DISTANCE</span><div style={{ fontSize: '1.15rem', fontWeight: 800 }}>{route.distance_km} km</div></div>
                  <div><span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>DYNAMIC ETA</span><div style={{ fontSize: '1.15rem', fontWeight: 800, color: 'var(--accent-emerald)' }}>{route.eta_minutes} mins</div></div>
                  <div><span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>DTC FARE</span><div style={{ fontSize: '1.15rem', fontWeight: 800, color: 'var(--accent-cyan)' }}>₹{route.fare_inr || 15}</div></div>
                  <div><span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>CO₂ SAVED</span><div style={{ fontSize: '1.15rem', fontWeight: 800, color: 'var(--accent-emerald)' }}>🌱 {route.carbon_saved_kg || 0.8} kg</div></div>
                  <div><span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>SPEED</span><div style={{ fontSize: '1.15rem', fontWeight: 800, color: 'var(--primary-orange)' }}>{route.effective_speed_kmh} km/h</div></div>

                  <button
                    onClick={() => {
                      setIsSimulating(!isSimulating);
                      setActiveTab('map');
                      addToast(isSimulating ? 'Paused route simulation' : 'Starting route simulation...', '🕹️');
                    }}
                    style={{
                      background: isSimulating ? 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)' : 'linear-gradient(135deg, #10b981 0%, #059669 100%)',
                      color: '#fff', border: 'none', padding: '8px 14px', borderRadius: '8px', fontSize: '0.8rem',
                      fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '6px',
                    }}
                  >
                    {isSimulating ? '⏸ Pause Sim' : '▶ Simulate Journey'}
                  </button>

                  <button
                    onClick={() => setShowItinerary(!showItinerary)}
                    style={{
                      background: 'rgba(255, 107, 53, 0.15)', border: '1px solid var(--border-subtle)',
                      color: 'var(--primary-orange)', padding: '8px 14px', borderRadius: '8px', fontSize: '0.8rem',
                      fontWeight: 700, cursor: 'pointer',
                    }}
                  >
                    {showItinerary ? '▲ Hide Steps' : `🧭 Steps (${route.itinerary ? route.itinerary.length : 0})`}
                  </button>
                </div>
              </div>

              {/* Turn-by-Turn Journey Itinerary Card */}
              {showItinerary && route.itinerary && route.itinerary.length > 0 && (
                <div style={{ marginTop: '16px', paddingTop: '14px', borderTop: '1px solid var(--border-glass)' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                    <div style={{ fontSize: '0.82rem', fontWeight: 800, color: 'var(--primary-orange)', textTransform: 'uppercase' }}>
                      🧭 Turn-by-Turn Commuter Itinerary
                    </div>
                    <button
                      onClick={() => {
                        const summary = `Delhi Transit Route: ${selectedSrc} to ${selectedDst}\nDistance: ${route.distance_km} km | ETA: ${route.eta_minutes} mins | Fare: ₹${route.fare_inr}\nItinerary:\n` +
                          route.itinerary.map(i => `${i.step}. ${i.instruction} (${i.meta})`).join('\n');
                        navigator.clipboard.writeText(summary);
                        addToast('Itinerary copied to clipboard!', '📋');
                      }}
                      style={{
                        background: 'transparent', border: 'none', color: 'var(--accent-cyan)',
                        fontSize: '0.78rem', fontWeight: 700, cursor: 'pointer'
                      }}
                    >
                      📋 Copy Itinerary
                    </button>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '10px' }}>
                    {route.itinerary.map((step, idx) => (
                      <div key={idx} style={{
                        background: 'var(--bg-elevated)', border: '1px solid var(--border-glass)',
                        borderRadius: '8px', padding: '10px 14px', display: 'flex', gap: '12px', alignItems: 'center'
                      }}>
                        <div style={{
                          width: '30px', height: '30px', borderRadius: '50%',
                          background: idx === 0 ? 'var(--accent-emerald)' : (idx === route.itinerary.length - 1 ? 'var(--accent-rose)' : 'var(--accent-cyan)'),
                          display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.9rem', color: '#fff', flexShrink: 0
                        }}>
                          {step.icon || (idx === 0 ? '🟢' : (idx === route.itinerary.length - 1 ? '🏁' : '🚌'))}
                        </div>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: '0.84rem', fontWeight: 700, color: 'var(--text-main)' }}>{step.instruction}</div>
                          <div style={{ fontSize: '0.74rem', color: 'var(--text-dim)', marginTop: '2px' }}>
                            {step.meta || 'Transit leg'}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Navigation Tabs */}
          <div style={{ display: 'flex', gap: '8px', marginBottom: '18px', flexWrap: 'wrap' }}>
            {[
              { id: 'map', label: '🗺️ Map & Simulator', badge: route ? 'Route Ready' : null },
              { id: 'fleet', label: '🚌 Fleet Explorer', badge: `${fleet.length} Active` },
              { id: 'ml', label: '🔮 AI Traffic Forecast', badge: '30m / 60m' },
              { id: 'alerts', label: '🚨 Transit Alerts', badge: `${(alerts.bottlenecks?.length || 0) + (alerts.bunching?.length || 0)} Issues` },
              { id: 'branching', label: '🔀 Corridor Alternatives', badge: branchData ? `${branchData.branches?.length || 0} Routes` : null },
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                style={{
                  background: activeTab === tab.id ? 'linear-gradient(135deg, rgba(255, 107, 53, 0.25), rgba(255, 153, 51, 0.15))' : 'var(--bg-card)',
                  color: activeTab === tab.id ? 'var(--primary-orange)' : 'var(--text-muted)',
                  border: `1px solid ${activeTab === tab.id ? 'var(--border-accent)' : 'var(--border-glass)'}`,
                  padding: '10px 18px', borderRadius: '10px', fontWeight: 700, fontSize: '0.88rem',
                  cursor: 'pointer', transition: 'all 0.2s ease', display: 'flex', alignItems: 'center', gap: '8px',
                }}
              >
                <span>{tab.label}</span>
                {tab.badge && (
                  <span style={{
                    background: activeTab === tab.id ? 'var(--primary-orange)' : 'var(--bg-elevated)',
                    color: activeTab === tab.id ? '#ffffff' : 'var(--text-dim)',
                    fontSize: '0.7rem', padding: '2px 7px', borderRadius: '12px', fontWeight: 800
                  }}>
                    {tab.badge}
                  </span>
                )}
              </button>
            ))}
          </div>

          {/* TAB 1: INTERACTIVE MAP & ROUTE PLANNER */}
          {activeTab === 'map' && (
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 340px', gap: '20px', alignItems: 'start' }}>
              <LeafletMapContainer
                fleet={fleet}
                segments={segments}
                stops={stops}
                route={route}
                corridorFocus={corridorFocus}
                layerVisibility={layerVisibility}
                onMapClick={handleMapClick}
                clickPoints={clickPoints}
                trackingBus={trackingBus}
                onStopTracking={() => setTrackingBus(null)}
                isSimulating={isSimulating}
                simProgress={simProgress}
                setSimProgress={setSimProgress}
                simSpeedMultiplier={simSpeedMultiplier}
                timeOffsetMinutes={timeOffsetMinutes}
                onViewStopArrivals={fetchStopArrivals}
              />

              {/* Sidebar Controls */}
              <div className="glass-panel" style={{ padding: '20px', display: 'flex', flexDirection: 'column', gap: '16px' }}>

                {/* Stop Live Arrival Countdown Card (if opened) */}
                {selectedStopData && (
                  <div style={{
                    background: 'rgba(2, 132, 199, 0.12)', border: '1px solid rgba(56, 189, 248, 0.45)',
                    borderRadius: '10px', padding: '12px 14px'
                  }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                      <div style={{ fontSize: '0.86rem', fontWeight: 800, color: 'var(--accent-cyan)' }}>
                        🚏 {selectedStopData.stop_name}
                      </div>
                      <button
                        onClick={() => setSelectedStopData(null)}
                        style={{ background: 'transparent', border: 'none', color: 'var(--text-dim)', fontSize: '0.8rem', cursor: 'pointer' }}
                      >
                        ✕
                      </button>
                    </div>
                    <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)', marginBottom: '8px' }}>
                      Upcoming live arrivals within 7.5 km:
                    </div>
                    {selectedStopData.arrivals && selectedStopData.arrivals.length > 0 ? (
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '6px', maxHeight: '180px', overflowY: 'auto' }}>
                        {selectedStopData.arrivals.slice(0, 6).map((arr, i) => (
                          <div key={i} style={{
                            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                            background: 'var(--bg-elevated)', padding: '6px 10px', borderRadius: '6px', fontSize: '0.78rem'
                          }}>
                            <div>
                              <strong style={{ color: 'var(--text-main)' }}>Route {arr.route_id}</strong>
                              <span style={{ fontSize: '0.7rem', color: 'var(--text-dim)', marginLeft: '6px' }}>#{arr.bus_id}</span>

          {/* Toast Notification Container */}

                    onClick={() => setShowTransitPass(false)}
