    // --- Enhanced Leaflet Map Component with Simulation & Lock-on Camera ---
    function LeafletMapContainer({
      fleet, segments, stops, route, corridorFocus, layerVisibility,
      onMapClick, clickPoints, trackingBus, onStopTracking,
      isSimulating, simProgress, setSimProgress, simSpeedMultiplier,
      timeOffsetMinutes, onViewStopArrivals
    }) {
      const mapRef = useRef(null);
      const instanceRef = useRef(null);
      const roadGroup = useRef(null);
      const fleetGroup = useRef(null);
      const stopsGroup = useRef(null);
      const walkshedGroup = useRef(null);
      const routeGroup = useRef(null);
      const clickGroup = useRef(null);
      const simBusMarker = useRef(null);
      const [mapReady, setMapReady] = useState(false);

      const onMapClickRef = useRef(onMapClick);
      useEffect(() => {
        onMapClickRef.current = onMapClick;
      }, [onMapClick]);

      // Map Initialization
      useEffect(() => {
        if (!mapRef.current || instanceRef.current) return;
        const map = L.map(mapRef.current, { center: [28.6139, 77.2090], zoom: 12 });
        instanceRef.current = map;

        // Tile basemaps
        const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          maxZoom: 19,
          attribution: '&copy; CARTO & OpenStreetMap',
        }).addTo(map);

        const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap',
        });

        const esriStreet = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19,
          attribution: '&copy; Esri',
        });

        const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19,
          attribution: '&copy; Esri',
        });

        const light = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; CARTO',
        });

        L.control.layers({
          '🌙 Cyberpunk Dark': dark,
          '🗺️ OpenStreetMap': osm,
          '🏛️ Esri Street': esriStreet,
          '🛰️ Satellite': sat,
          '☀️ Clean Light': light,
        }, null, { position: 'topright' }).addTo(map);

        roadGroup.current = L.layerGroup().addTo(map);
        fleetGroup.current = L.layerGroup().addTo(map);
        stopsGroup.current = L.layerGroup().addTo(map);
        walkshedGroup.current = L.layerGroup().addTo(map);
        routeGroup.current = L.layerGroup().addTo(map);
        clickGroup.current = L.layerGroup().addTo(map);

        map.on('click', e => {
          if (onMapClickRef.current) {
            onMapClickRef.current(e.latlng.lat, e.latlng.lng);
          }
        });

        setTimeout(() => { if (map) map.invalidateSize(); }, 200);
        setMapReady(true);

        return () => {
          map.remove();
          instanceRef.current = null;
          roadGroup.current = null;
          fleetGroup.current = null;
          stopsGroup.current = null;
          walkshedGroup.current = null;
          routeGroup.current = null;
          clickGroup.current = null;
          setMapReady(false);
        };
      }, []);

      // Focus Corridor Fly-to
      useEffect(() => {
        const map = instanceRef.current;
        if (!map) return;
        const coords = {
          'all': [[28.6139, 77.2090], 12],
          'central': [[28.6250, 77.2180], 13.5],
          'north': [[28.6672, 77.2284], 14],
          'south': [[28.5672, 77.2100], 13.5],
          'east': [[28.6364, 77.2956], 13.5],
          'west': [[28.5950, 77.0700], 13.5],
        };
        const t = coords[corridorFocus] || coords['all'];
        map.flyTo(t[0], t[1], { duration: 1.2 });
      }, [corridorFocus]);

      // Render Road Segments with Time-Machine Forecast logic
      useEffect(() => {
        if (!mapReady || !roadGroup.current) return;
        roadGroup.current.clearLayers();
        if (!layerVisibility.segments || !segments) return;

        segments.forEach(seg => {
          let speed = seg.speed_kmh;
          let level = seg.congestion_level;

          // Adjust speed if Time Machine Slider is active
          if (timeOffsetMinutes > 0) {
            // Apply simulated ML forecast factor
            const factor = timeOffsetMinutes === 15 ? 0.95 : (timeOffsetMinutes === 30 ? 0.88 : (timeOffsetMinutes === 45 ? 0.82 : 0.78));
            speed = Math.round(speed * factor * 10) / 10;
            if (speed >= 24) level = 'free_flow';
            else if (speed >= 16) level = 'moderate';
            else if (speed >= 10) level = 'heavy';
            else level = 'gridlock';
          }

          const color = CONGESTION_COLORS[level] || '#10b981';
          const p = L.polyline(seg.coordinates, { color, weight: 4.5, opacity: 0.9 });
          p.bindPopup(`
            <div style="font-family: inherit; padding: 2px;">
              <strong style="color: var(--primary-orange); font-size: 13px;">🛣️ ${seg.road_name}</strong>
              <div style="font-size: 11px; color: var(--text-muted); margin-top: 3px;">
                Type: <b>${seg.road_type}</b> | Length: <b>${seg.length_m}m</b>
              </div>
              <div style="margin-top: 6px; font-size: 12px; font-weight: 700; color: ${color};">
                Velocity: ${speed} km/h (${level.toUpperCase()})
                ${timeOffsetMinutes > 0 ? ` [Forecast +${timeOffsetMinutes}m]` : ''}
              </div>
            </div>
          `);
          p.addTo(roadGroup.current);
        });
      }, [segments, layerVisibility.segments, timeOffsetMinutes, mapReady]);

      // Render Fleet Markers & Handle Lock-on Tracking
      useEffect(() => {
        if (!mapReady || !fleetGroup.current) return;
        fleetGroup.current.clearLayers();
        if (!layerVisibility.fleet || !fleet) return;

        fleet.slice(0, 480).forEach(bus => {
          const spd = bus.speed || 0;
          const isTarget = trackingBus === bus.bus_id;
          const color = isTarget ? '#00f0ff' : (spd >= 20 ? '#10b981' : (spd >= 5 ? '#f59e0b' : '#ef4444'));

          const busHtml = `
            <div style="transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; cursor: pointer;">
              <div style="
                width: ${isTarget ? '22px' : '16px'}; height: ${isTarget ? '22px' : '16px'};
                border-radius: 50%; background: ${color}; border: 2px solid #ffffff;
                box-shadow: 0 0 ${isTarget ? '16px #00f0ff' : '8px ' + color};
                display: flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; font-weight: 800;
              ">
                ${isTarget ? '★' : ''}
              </div>
            </div>`;

          const m = L.marker([bus.lat, bus.lon], {
            icon: L.divIcon({ className: 'bus-marker-div', html: busHtml, iconSize: [0, 0] }),
            zIndexOffset: isTarget ? 3000 : 500
          });

          m.bindPopup(`
            <div style="font-family: inherit; min-width: 170px; padding: 2px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <strong style="color: var(--primary-orange); font-size: 13px;">🚌 Bus #${bus.bus_id}</strong>
                <span style="font-size: 10px; background: rgba(56, 189, 248, 0.2); color: #38bdf8; padding: 1px 6px; border-radius: 10px; font-weight: 700;">
                  Route ${bus.route_id}
                </span>
              </div>
              <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px;">
                Speed: <b style="color: ${color}">${spd.toFixed(1)} km/h</b> • Status: <b>${bus.status}</b>
              </div>
              <button
                onclick="window.__trackBus('${bus.bus_id}')"
                style="width: 100%; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer;"
              >
                🛰️ Track & Follow Bus
              </button>
            </div>
          `);

          m.addTo(fleetGroup.current);

          // If this is the tracked bus, smoothly pan map
          if (isTarget && instanceRef.current) {
            instanceRef.current.panTo([bus.lat, bus.lon], { animate: true, duration: 0.8 });
          }
        });
      }, [fleet, layerVisibility.fleet, trackingBus, mapReady]);

      // Render Bus Stops & Walksheds
      useEffect(() => {
        if (!mapReady || !stopsGroup.current || !walkshedGroup.current) return;
        stopsGroup.current.clearLayers();
        walkshedGroup.current.clearLayers();
        if (!stops) return;

        if (layerVisibility.stops) {
          stops.forEach(s => {
            const stopHtml = `
              <div style="transform: translate(-50%, -50%); cursor: pointer;">
                <div style="width: 14px; height: 14px; border-radius: 50%; background: #0284c7; border: 2px solid #ffffff; box-shadow: 0 0 8px rgba(2, 132, 199, 0.7);"></div>
              </div>`;

            const m = L.marker([s.lat, s.lon], {
              icon: L.divIcon({ className: 'stop-pin', html: stopHtml, iconSize: [0, 0] })
            });

            const routesArr = s.routes || [];
            const metroList = (s.metro_lines || []).map(m => `<span class="metro-badge" style="font-size: 9px; margin: 1px 2px;">🚇 ${m}</span>`).join('');

            const popupContent = `
              <div style="font-family: inherit; min-width: 190px; padding: 2px;">
                <div style="font-weight: 800; color: #38bdf8; font-size: 13px; margin-bottom: 2px;">🚏 ${s.name}</div>
                <div style="font-size: 10px; color: var(--text-dim); margin-bottom: 4px;">Stop ID: <b>${s.stop_id}</b></div>
                ${metroList ? `<div style="margin-bottom: 6px; display: flex; flex-wrap: wrap;">${metroList}</div>` : ''}
                <div style="display: flex; gap: 6px; margin-top: 8px;">
                  <button onclick="window.__setOrigin(${s.lat}, ${s.lon}, '${s.name.replace(/'/g, "\\'")}')" style="flex: 1; background: #10b981; color: #fff; border: none; padding: 5px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer;">🟢 Origin</button>
                  <button onclick="window.__setDest(${s.lat}, ${s.lon}, '${s.name.replace(/'/g, "\\'")}')" style="flex: 1; background: #ef4444; color: #fff; border: none; padding: 5px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer;">🔴 Dest</button>
                </div>
                <button onclick="window.__viewStopArrivals('${s.stop_id}')" style="width: 100%; margin-top: 6px; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #fff; border: none; padding: 6px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 700; cursor: pointer;">⏱️ Live Arrival Board</button>
              </div>
            `;
            m.bindPopup(popupContent);
            m.bindTooltip(`🚏 ${s.name}`, { direction: 'top', offset: [0, -8] });
            m.addTo(stopsGroup.current);
          });
        }

        if (layerVisibility.walkshed) {
          stops.forEach(s => {
            L.circle([s.lat, s.lon], {
              radius: 500,
              color: '#0ea5e9',
              fillColor: '#0ea5e9',
              fillOpacity: 0.06,
              weight: 1,
              dashArray: '4 4',
            }).addTo(walkshedGroup.current);
          });
        }
      }, [stops, layerVisibility.stops, layerVisibility.walkshed, mapReady]);

      // Render Planned Route
      useEffect(() => {
        if (!mapReady || !routeGroup.current) return;
        routeGroup.current.clearLayers();

        if (route && route.geojson) {
          const l = L.geoJSON(route.geojson, {
            style: { color: '#00f0ff', weight: 6, opacity: 0.95, dashArray: '8 5' }
          }).addTo(routeGroup.current);

          if (instanceRef.current && l.getBounds().isValid()) {
            instanceRef.current.fitBounds(l.getBounds(), { padding: [50, 50] });
          }
        }
      }, [route, mapReady]);

      // Origin & Destination Pins
      useEffect(() => {
        if (!mapReady || !clickGroup.current) return;
        clickGroup.current.clearLayers();

        if (clickPoints.start) {
          const oHtml = `
            <div style="transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center;">
              <div style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff; padding: 4px 10px; border-radius: 20px; font-weight: 800; font-size: 11px; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.7); border: 2px solid #ffffff; white-space: nowrap;">
                🟢 ORIGIN
              </div>
              <div style="width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid #059669;"></div>
            </div>`;
          L.marker(clickPoints.start, { icon: L.divIcon({ className: 'o-pin', html: oHtml, iconSize: [0, 0] }), zIndexOffset: 2000 })
            .addTo(clickGroup.current);
        }

        if (clickPoints.end) {
          const dHtml = `
            <div style="transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center;">
              <div style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: #ffffff; padding: 4px 10px; border-radius: 20px; font-weight: 800; font-size: 11px; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.7); border: 2px solid #ffffff; white-space: nowrap;">
                🔴 DESTINATION
              </div>
              <div style="width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid #dc2626;"></div>
            </div>`;
          L.marker(clickPoints.end, { icon: L.divIcon({ className: 'd-pin', html: dHtml, iconSize: [0, 0] }), zIndexOffset: 2000 })
            .addTo(clickGroup.current);
        }
      }, [clickPoints, mapReady]);

      // Route Simulation Animation Loop
      useEffect(() => {
        if (!isSimulating || !route || !route.route_latlngs || route.route_latlngs.length < 2) {
          if (simBusMarker.current && routeGroup.current) {
            routeGroup.current.removeLayer(simBusMarker.current);
            simBusMarker.current = null;
          }
          return;
        }

        const waypoints = route.route_latlngs;
        const totalPoints = waypoints.length;

        const interval = setInterval(() => {
          setSimProgress(prev => {
            const next = prev + (0.5 * simSpeedMultiplier);
            if (next >= 100) {
              clearInterval(interval);
              return 100;
            }
            return next;
          });
        }, 100);

        return () => clearInterval(interval);
      }, [isSimulating, route, simSpeedMultiplier]);

      // Update Simulated Bus Marker Position on Map
      useEffect(() => {
        if (!route || !route.route_latlngs || route.route_latlngs.length < 2 || !routeGroup.current) return;
        const waypoints = route.route_latlngs;
        const total = waypoints.length;
        const floatIndex = (simProgress / 100) * (total - 1);
        const idx1 = Math.floor(floatIndex);
        const idx2 = Math.min(idx1 + 1, total - 1);
        const frac = floatIndex - idx1;

        const p1 = waypoints[idx1];
        const p2 = waypoints[idx2];
        const curLat = p1[0] + (p2[0] - p1[0]) * frac;
        const curLon = p1[1] + (p2[1] - p1[1]) * frac;

        const simHtml = `
          <div style="transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; pointer-events: none;">
            <div style="background: linear-gradient(135deg, #FF6B35 0%, #e85d04 100%); color: #fff; padding: 4px 10px; border-radius: 14px; font-weight: 800; font-size: 11px; border: 2px solid #fff; box-shadow: 0 0 16px rgba(255,107,53,0.9); white-space: nowrap; display: flex; align-items: center; gap: 4px;">
              <span>🚌 DTC SIMULATOR</span>
            </div>
            <div class="pulse-dot-cyan" style="margin-top: 2px;"></div>
          </div>`;

        if (!simBusMarker.current) {
          simBusMarker.current = L.marker([curLat, curLon], {
            icon: L.divIcon({ className: 'sim-bus-marker', html: simHtml, iconSize: [0, 0] }),
            zIndexOffset: 4000
          }).addTo(routeGroup.current);
        } else {
          simBusMarker.current.setLatLng([curLat, curLon]);
        }
      }, [simProgress, route]);

      // Active Tracked Bus Object
      const activeTrackedBusObj = useMemo(() => {
        if (!trackingBus || !fleet) return null;
        return fleet.find(b => b.bus_id === trackingBus);
      }, [trackingBus, fleet]);

      return (
        <div style={{ position: 'relative', width: '100%', height: '620px', borderRadius: '14px', overflow: 'hidden' }}>
          <div ref={mapRef} style={{ width: '100%', height: '100%' }} />

          {/* Floating Tracking HUD */}
          {activeTrackedBusObj && (
            <div style={{
              position: 'absolute', top: '16px', left: '16px', zIndex: 1000,
              maxWidth: '360px', width: 'calc(100% - 32px)',
            }}>
              <div className="hud-card" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                    <span className="pulse-dot-cyan" />
                    <strong style={{ color: 'var(--accent-cyan)', fontSize: '0.9rem' }}>
                      LOCK-ON: Bus #{activeTrackedBusObj.bus_id}
                    </strong>
                  </div>
                  <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)', marginTop: '2px' }}>
                    Route: <b style={{ color: 'var(--text-main)' }}>{activeTrackedBusObj.route_id}</b> • Speed: <b style={{ color: '#10b981' }}>{activeTrackedBusObj.speed} km/h</b> • Status: {activeTrackedBusObj.status}
                  </div>
                </div>
                <button
                  onClick={onStopTracking}
                  style={{
                    background: 'rgba(239, 68, 68, 0.2)', border: '1px solid rgba(239, 68, 68, 0.5)',
                    color: '#ef4444', borderRadius: '6px', padding: '4px 10px', fontSize: '0.74rem',
                    fontWeight: 800, cursor: 'pointer'
                  }}
                >
                  ✕ Unfollow
                </button>
              </div>
            </div>
          )}

          {/* Floating Route Simulation HUD */}
          {isSimulating && route && (
            <div style={{
              position: 'absolute', bottom: '20px', left: '20px', right: '20px', zIndex: 1000,
            }}>
              <div className="hud-card" style={{ padding: '12px 18px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '10px', marginBottom: '8px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                    <span className="pulse-dot-green" />
                    <strong style={{ color: 'var(--accent-emerald)', fontSize: '0.88rem' }}>
                      ROUTE SIMULATION ACTIVE ({Math.round(simProgress)}% COMPLETED)
                    </strong>
                  </div>
                  <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>
                    Speed: <strong style={{ color: 'var(--primary-orange)' }}>{route.effective_speed_kmh} km/h</strong> • Approx {(route.eta_minutes * (1 - simProgress/100)).toFixed(1)} mins remaining
                  </div>
                </div>

                {/* Simulation Progress Bar */}
                <div style={{ width: '100%', height: '6px', background: 'var(--bg-elevated)', borderRadius: '3px', overflow: 'hidden' }}>
                  <div style={{
                    width: `${simProgress}%`, height: '100%',
                    background: 'linear-gradient(90deg, #10b981, #00f0ff)',
                    transition: 'width 0.1s linear'
                  }} />
                </div>
              </div>
            </div>
          )}

          {/* Floating Click-to-Route Guide Pill */}
          <div style={{
            position: 'absolute', top: '16px', right: '80px', zIndex: 900,
            background: 'var(--bg-card)', border: '1px solid var(--border-glass)',
            padding: '6px 14px', borderRadius: '20px', fontSize: '0.74rem', fontWeight: 600,
            boxShadow: '0 4px 16px rgba(0,0,0,0.4)', backdropFilter: 'blur(10px)',
            display: 'flex', alignItems: 'center', gap: '8px', color: 'var(--text-muted)'
          }}>
            <span>👆 Click Map:</span>
            <span style={{ color: clickPoints.start ? 'var(--accent-emerald)' : 'var(--text-dim)' }}>
              1st = Origin {clickPoints.start ? '✓' : ''}
            </span>
            <span>•</span>
            <span style={{ color: clickPoints.end ? 'var(--accent-rose)' : 'var(--text-dim)' }}>
              2nd = Dest {clickPoints.end ? '✓' : ''}
            </span>
          </div>
        </div>
      );
    }

    // --- Active Fleet Explorer Table Component ---
    function BusTableComponent({ fleet, onTrackBus }) {
      const [search, setSearch] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [sortBy, setSortBy] = useState('speed_desc');
      const [viewMode, setViewMode] = useState('table'); // table or cards

      const filtered = useMemo(() => {
        let list = fleet || [];
        if (search.trim()) {
          const q = search.trim().toLowerCase();
          list = list.filter(b =>
            b.bus_id.toLowerCase().includes(q) ||
            b.route_id.toLowerCase().includes(q) ||
            b.status.toLowerCase().includes(q)
          );
        }
        if (statusFilter !== 'ALL') {
          if (statusFilter === 'FAST') list = list.filter(b => b.speed >= 20);
          else if (statusFilter === 'MODERATE') list = list.filter(b => b.speed >= 5 && b.speed < 20);
          else if (statusFilter === 'SLOW') list = list.filter(b => b.speed < 5);
        }

        // Sorting
        return [...list].sort((a, b) => {
          if (sortBy === 'speed_desc') return (b.speed || 0) - (a.speed || 0);
          if (sortBy === 'speed_asc') return (a.speed || 0) - (b.speed || 0);
          if (sortBy === 'bus_id') return a.bus_id.localeCompare(b.bus_id);
          if (sortBy === 'route') return a.route_id.localeCompare(b.route_id);
          return 0;
        });
      }, [fleet, search, statusFilter, sortBy]);

      return (
        <div className="glass-panel" style={{ padding: '24px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '14px', marginBottom: '20px' }}>
            <div>
              <h2 style={{ fontSize: '1.25rem', fontWeight: 800, color: 'var(--primary-orange)' }}>
                🚌 Active Delhi Transit Fleet Explorer
              </h2>
              <p style={{ fontSize: '0.82rem', color: 'var(--text-muted)', marginTop: '2px' }}>
                Real-time GPS coordinates, velocity telemetry, and active corridor assignments
              </p>
            </div>

            {/* Filter and Search Bar */}
            <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap', alignItems: 'center' }}>
              <input
                type="text"
                placeholder="Search Bus ID or Route..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                style={{
                  background: 'var(--bg-elevated)', color: 'var(--text-main)',
                  border: '1px solid var(--border-subtle)', borderRadius: '8px',
                  padding: '8px 14px', fontSize: '0.82rem', minWidth: '220px', outline: 'none'
                }}
              />

              <div style={{ display: 'flex', background: 'var(--bg-elevated)', borderRadius: '8px', padding: '3px', border: '1px solid var(--border-glass)' }}>
                {[
                  { id: 'ALL', label: 'All' },
                  { id: 'FAST', label: '🟢 Free Flow' },
                  { id: 'MODERATE', label: '🟡 Moderate' },
                  { id: 'SLOW', label: '🔴 Slow/Dwell' },
                ].map(f => (
                  <button
                    key={f.id}
                    onClick={() => setStatusFilter(f.id)}
                    style={{
                      background: statusFilter === f.id ? 'var(--primary-orange)' : 'transparent',
                      color: statusFilter === f.id ? '#ffffff' : 'var(--text-muted)',
                      border: 'none', padding: '5px 10px', borderRadius: '6px', fontSize: '0.74rem',
                      fontWeight: 700, cursor: 'pointer'
                    }}
                  >
                    {f.label}
                  </button>
                ))}
              </div>

              <select
                value={sortBy}
                onChange={e => setSortBy(e.target.value)}
                style={{
                  background: 'var(--bg-elevated)', color: 'var(--text-main)',
                  border: '1px solid var(--border-glass)', borderRadius: '8px',
                  padding: '8px 12px', fontSize: '0.82rem', fontWeight: 600, outline: 'none'
                }}
              >
                <option value="speed_desc">⚡ Fastest First</option>
                <option value="speed_asc">🐢 Slowest First</option>
                <option value="bus_id">🔢 Bus ID</option>
                <option value="route">🛣️ Route ID</option>
              </select>

              <button
                onClick={() => setViewMode(viewMode === 'table' ? 'cards' : 'table')}
                style={{
                  background: 'var(--bg-elevated)', color: 'var(--text-main)',
                  border: '1px solid var(--border-glass)', padding: '8px 12px',
                  borderRadius: '8px', fontSize: '0.82rem', fontWeight: 700, cursor: 'pointer'
                }}
              >
                {viewMode === 'table' ? '🗂️ Cards View' : '📋 Table View'}
              </button>
            </div>
          </div>

          <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginBottom: '12px' }}>
            Showing <strong>{filtered.length}</strong> active buses matching filters:
          </div>

          {viewMode === 'table' ? (
            <div style={{ overflowX: 'auto', maxHeight: '560px', border: '1px solid var(--border-glass)', borderRadius: '10px' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'left', fontSize: '0.84rem' }}>
                <thead style={{ background: 'var(--bg-elevated)', position: 'sticky', top: 0, zIndex: 10 }}>
                  <tr>
                    <th style={{ padding: '10px 14px', color: 'var(--primary-orange)' }}>Bus Unit</th>
                    <th style={{ padding: '10px 14px', color: 'var(--primary-orange)' }}>Assigned Route</th>
                    <th style={{ padding: '10px 14px', color: 'var(--primary-orange)' }}>Velocity (km/h)</th>
                    <th style={{ padding: '10px 14px', color: 'var(--primary-orange)' }}>GPS Coordinates</th>
                    <th style={{ padding: '10px 14px', color: 'var(--primary-orange)' }}>Status</th>
                    <th style={{ padding: '10px 14px', color: 'var(--primary-orange)', textAlign: 'center' }}>Map Action</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.slice(0, 100).map((b, idx) => {
                    const spd = b.speed || 0;
                    const c = spd >= 20 ? 'var(--accent-emerald)' : (spd >= 5 ? 'var(--accent-amber)' : 'var(--accent-rose)');
                    return (
                      <tr
                        key={b.bus_id + idx}
                        style={{
                          borderBottom: '1px solid var(--border-glass)',
                          background: idx % 2 === 0 ? 'transparent' : 'rgba(255, 255, 255, 0.015)'
                        }}
                      >
                        <td style={{ padding: '10px 14px', fontWeight: 800, fontFamily: "'JetBrains Mono', monospace" }}>
                          #{b.bus_id}
                        </td>
                        <td style={{ padding: '10px 14px' }}>
                          <span style={{ background: 'rgba(56, 189, 248, 0.15)', color: 'var(--accent-cyan)', padding: '2px 8px', borderRadius: '6px', fontWeight: 700, fontSize: '0.78rem' }}>
                            {b.route_id}
                          </span>
                        </td>
                        <td style={{ padding: '10px 14px' }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                            <div style={{ width: '50px', height: '6px', background: 'var(--bg-elevated)', borderRadius: '3px', overflow: 'hidden' }}>
                              <div style={{ width: `${Math.min(100, (spd / 60) * 100)}%`, height: '100%', background: c }} />
                            </div>
                            <strong style={{ color: c }}>{spd.toFixed(1)} km/h</strong>
                          </div>
                        </td>
                        <td style={{ padding: '10px 14px', color: 'var(--text-dim)', fontFamily: "'JetBrains Mono', monospace", fontSize: '0.78rem' }}>
                          {b.lat.toFixed(4)}, {b.lon.toFixed(4)}
                        </td>
                        <td style={{ padding: '10px 14px' }}>
                          <span style={{ fontSize: '0.74rem', padding: '2px 8px', borderRadius: '10px', background: `${c}20`, color: c, fontWeight: 700 }}>
                            {b.status}
                          </span>
                        </td>
                        <td style={{ padding: '10px 14px', textAlign: 'center' }}>
                          <button
                            onClick={() => onTrackBus(b.bus_id)}
                            style={{
                              background: 'rgba(255, 107, 53, 0.15)', border: '1px solid var(--border-subtle)',
                              color: 'var(--primary-orange)', padding: '4px 10px', borderRadius: '6px',
                              fontSize: '0.74rem', fontWeight: 700, cursor: 'pointer'
                            }}
                          >
                            📍 Track
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '14px', maxHeight: '560px', overflowY: 'auto' }}>
              {filtered.slice(0, 100).map((b, idx) => {
                const spd = b.speed || 0;
                const c = spd >= 20 ? 'var(--accent-emerald)' : (spd >= 5 ? 'var(--accent-amber)' : 'var(--accent-rose)');
                return (
                  <div key={b.bus_id + idx} className="glass-panel" style={{ padding: '14px', border: '1px solid var(--border-glass)' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>

              </h2>

                      </div>
                    </div>
                    <div>
                      <span style={{ fontSize: '0.68rem', color: 'var(--text-dim)' }}>+30 MINS</span>
                      <div style={{ fontSize: '1.1rem', fontWeight: 800, color: trendColor }}>

    // --- Branch Map Container (Leaflet) ---
    function BranchMapContainer({ origin, destination, branches, selectedBranchId, onSelectBranch }) {
      const bMapRef = useRef(null);
      const bInstanceRef = useRef(null);
      const bLayerGroup = useRef(null);

      useEffect(() => {
        if (!bMapRef.current || bInstanceRef.current) return;
        const bmap = L.map(bMapRef.current, { center: [28.6139, 77.2090], zoom: 12 });
        bInstanceRef.current = bmap;

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          maxZoom: 19,
          attribution: '&copy; CARTO & OpenStreetMap',
        }).addTo(bmap);

        bLayerGroup.current = L.layerGroup().addTo(bmap);
        setTimeout(() => { if (bmap) bmap.invalidateSize(); }, 250);

        return () => {
          bmap.remove();
          bInstanceRef.current = null;
          bLayerGroup.current = null;
        };
      }, []);

      // Draw Branches
      useEffect(() => {
        const bmap = bInstanceRef.current;
        if (!bmap || !bLayerGroup.current || !origin || !destination) return;
        bLayerGroup.current.clearLayers();

        const allBounds = [];

        // Origin Marker
        const oLatLon = [origin.lat, origin.lon];
        allBounds.push(oLatLon);
        const oHtml = `
          <div style="transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center;">
            <div style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; padding: 4px 10px; border-radius: 20px; font-weight: 800; font-size: 11px; border: 2px solid #fff; box-shadow: 0 4px 14px rgba(16,185,129,0.7); white-space: nowrap;">
              🟢 POINT A: ${origin.name}
            </div>
            <div style="width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid #059669;"></div>
          </div>`;
        L.marker(oLatLon, { icon: L.divIcon({ className: 'b-o-pin', html: oHtml, iconSize: [0, 0] }) }).addTo(bLayerGroup.current);

        // Destination Marker
        const dLatLon = [destination.lat, destination.lon];
        allBounds.push(dLatLon);
        const dHtml = `
          <div style="transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center;">
            <div style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: #fff; padding: 4px 10px; border-radius: 20px; font-weight: 800; font-size: 11px; border: 2px solid #fff; box-shadow: 0 4px 14px rgba(239,68,68,0.7); white-space: nowrap;">
              🔴 POINT B: ${destination.name}
            </div>
            <div style="width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid #dc2626;"></div>
          </div>`;
        L.marker(dLatLon, { icon: L.divIcon({ className: 'b-d-pin', html: dHtml, iconSize: [0, 0] }) }).addTo(bLayerGroup.current);

        // Branches
        (branches || []).forEach(branch => {
          const isSelected = selectedBranchId === 'ALL' || selectedBranchId === branch.branch_id;
          const opacity = isSelected ? 0.95 : 0.25;
          const weight = isSelected ? 6 : 3;

          if (branch.coordinates && branch.coordinates.length > 1) {
            const poly = L.polyline(branch.coordinates, {
              color: branch.color || '#ff6b35',
              weight: weight,
              opacity: opacity,
              dashArray: isSelected ? null : '6 6',
            });
            poly.bindPopup(`<b>${branch.name}</b><br/>Via: ${branch.via}<br/>Active Buses: ${branch.total_active_buses}`);
            poly.on('click', () => onSelectBranch(branch.branch_id));
            poly.addTo(bLayerGroup.current);

            branch.coordinates.forEach(c => allBounds.push(c));
          }
        });

        if (allBounds.length > 1) {
          bmap.fitBounds(L.latLngBounds(allBounds), { padding: [40, 40] });
        }
      }, [origin, destination, branches, selectedBranchId]);

      return (
        <div style={{ position: 'relative', width: '100%', height: '400px', borderRadius: '12px', overflow: 'hidden' }}>
          <div ref={bMapRef} style={{ width: '100%', height: '100%' }} />
        </div>
      );
    }

                                {bus.speed_kmh} km/h
                              </td>
                              <td style={{ padding: '8px 12px' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                  <div style={{ flex: 1, height: '6px', background: 'var(--bg-elevated)', borderRadius: '3px', overflow: 'hidden' }}>
                                    <div style={{ width: `${bus.progress_pct}%`, height: '100%', background: b.color }} />
                                  </div>
                                  <span style={{ fontSize: '0.72rem', color: 'var(--text-dim)' }}>{bus.progress_pct}%</span>
                                </div>
                              </td>
                              <td style={{ padding: '8px 12px', color: 'var(--text-muted)' }}>
                                {bus.dist_to_destination_km} km
                              </td>
                              <td style={{ padding: '8px 12px', fontWeight: 800, color: 'var(--accent-emerald)' }}>
                                ~{bus.eta_to_dest_mins} mins
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  ) : (
                    <div style={{ fontSize: '0.78rem', color: 'var(--accent-amber)', fontStyle: 'italic', padding: '6px 0' }}>
                      No buses detected along this branch corridor right now.
                    </div>
                  )}
                </div>
              ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
